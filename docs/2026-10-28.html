<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>AI 每天学一点 · 10月28日</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --fg:#e8ecf4; --dim:#8b94a7;
    --accent:#4c8dff; --line:#232936; --ok:#3ddc97;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{max-width:100%;overflow-x:hidden;word-break:break-word;overflow-wrap:anywhere}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  }
  header{
    position:sticky;top:0;z-index:10;background:rgba(11,13,18,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:14px 18px calc(10px + env(safe-area-inset-top,0px));
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .date{font-size:13px;color:var(--dim);letter-spacing:.02em}
  .prog{font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);font-weight:600}
  .track{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  .fill{height:100%;background:var(--accent);width:0;transition:width .28s ease;border-radius:2px}

  main{flex:1;padding:22px 18px 0;max-width:680px;width:100%;margin:0 auto}
  .slide{display:none;animation:in .26s ease}
  .slide.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .tags{margin-bottom:10px}
  .tag{
    display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;
    background:rgba(76,141,255,.12);color:#7aa9ff;margin-right:6px;
    border:1px solid rgba(76,141,255,.22)
  }
  h1{font-size:23px;line-height:1.45;margin:0 0 20px;letter-spacing:-.01em}
  .block{margin-bottom:19px}
  .label{
    font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:5px;font-weight:600
  }
  .text{font-size:16px;color:#d5dbe8}
  .text.hl{color:var(--fg);border-left:2px solid var(--accent);padding-left:13px}
  a.src{
    display:inline-flex;align-items:center;gap:6px;margin-top:4px;
    font-size:14px;color:var(--accent);text-decoration:none;
    border-bottom:1px solid rgba(76,141,255,.3);padding-bottom:1px
  }
  .srcname{font-size:12px;color:var(--dim);margin-left:8px}

  /* 首尾页 */
  .hero h2{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.1em;margin:0 0 12px}
  .hero p{font-size:19px;line-height:1.7;margin:0 0 22px;color:#e8ecf4}
  .toc{list-style:none;padding:0;margin:8px 0 0}
  .toc li{
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim);
    display:flex;gap:10px
  }
  .toc li b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .task .label{color:var(--ok)}

  footer{
    position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));
    max-width:680px;width:100%;margin:0 auto;display:flex;gap:10px
  }
  button{
    flex:1;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .12s,opacity .12s
  }
  button:active{transform:scale(.975)}
  .next{background:var(--accent);color:#fff}
  .next.done{background:var(--ok);color:#04160d}
  .prev{flex:0 0 88px;background:var(--card);color:var(--dim);border:1px solid var(--line)}
  .prev:disabled{opacity:.3}
  .hint{
    text-align:center;font-size:12px;color:var(--dim);padding:0 18px 8px;
    max-width:680px;margin:0 auto
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="date">10月28日 周三</span>
    <span class="prog"><span id="cur">1</span> / <span id="tot">8</span></span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</header>

<main id="main"></main>

<p class="hint">← → 键或空格切换 · 手机上左右滑动</p>

<footer>
  <button class="prev" id="prev">上一条</button>
  <button class="next" id="next">下一条 →</button>
</footer>

<script>
const DATA = {"intro": "OpenAI 发布中端模型 GPT-6.1 Terra，API 价格减半；同时 Cloudflare 披露 GLM-5.3 跨请求 KV 缓存泄露事件。", "items": [{"title": "OpenAI 发布 GPT-6.1 Terra：API 价格减半，主打视觉推理与电脑操作", "summary": "OpenAI 发布 GPT-6.1 Terra，定位中端，输入 $1/百万 token、输出 $5/百万 token，约为 GPT-5.6 Terra 和 GPT-6.1 Sol 的一半价格，约为 GPT-6 Luna 的 10 倍。官方强调其视觉推理、精确电脑操作和更自然的写作能力，适用于起草提案、解读技术图纸、填表和视频编辑等日常工作。OpenAI 的 Ted Sanders 表示，Terra 在技术沟通上优于 Astra 和 Sol，视觉与电脑操作能力相近但快得多，其他方面略弱。", "so_what": "中端模型的价格性能比被重新定义：Artificial Analysis 称其在最大推理努力下 Intelligence Index 比 GPT-5.6 Terra 高 6 分，单任务成本仅 $0.40 对 $1.40；低推理档位提升 7 到 13 分，处于帕累托前沿。这意味着大量重复性电脑操作任务可以下放到更便宜的模型，而不必用旗舰模型。", "how_to_use": "在 API 中把批量、重复的电脑操作或表单填写任务从 Sol 切到 Terra，先用低推理档位跑一批真实任务，对比成功率和单任务成本；ChatGPT Plus/Pro/Enterprise/Edu 用户可在 ChatGPT Work 和 Codex 中直接选用。", "url": "https://the-decoder.com/gpt-6-1-terra-halves-openais-api-prices-and-still-gains-ground-on-its-larger-models/", "source": "The Decoder", "tags": ["模型发布", "API 定价"]}, {"title": "Simon Willison 实测 GPT-6.1 Terra：定位类似 Anthropic Sonnet，选择困难", "summary": "Simon Willison 指出，GPT-6.1 Terra 在 Anthropic 模型序列中对应 Sonnet 的位置——不是最便宜也不是最贵，因此更难决定何时使用。他记录了不同推理档位的 pelican 测试，其中 max 档耗时 4 分 11 秒、花费 11.3161 美分。他还整理了 GPT-6 Astra、GPT-6.1 Sol、GPT-6.1 Terra、GPT-6 Luna 的对比网格。", "so_what": "第三方实测补充了官方发布中不会强调的细节：max 推理档位延迟高、成本不低，说明 Terra 的性价比优势主要体现在低中推理档位，而非最高档。这提醒团队按任务档位而非模型名做选型。", "how_to_use": "参考其对比网格，为你的场景建立「模型 × 推理档位」的小型评测表，至少覆盖低、中、max 三档，记录延迟、成本和成功率，再决定默认档位。", "url": "https://simonwillison.net/2026/Oct/26/gpt-61-terra/", "source": "Simon Willison", "tags": ["模型评测", "推理成本"]}, {"title": "Cloudflare 披露 GLM-5.3 Workers AI 跨请求 KV 缓存泄露，155 条响应受影响", "summary": "Cloudflare 称 2026 年 8 月 27 日至 9 月 9 日期间，GLM-5.3 Workers AI 模型（@cf/zai-org/glm-5.3）出现租户隔离问题，少量客户收到包含其他客户请求数据的响应，共 155 条响应受影响，全部来自超过 681,280 token 的长提示。原因是 SGLang 推理引擎的 KV 缓存池只有 681,280 token 容量，而模型部署了 1,048,576 token 上下文窗口，超长请求在 disaggregated prefill/decode 模式下被替换为单 token 占位符后仍继续生成并传输 KV 缓存。Cloudflare 在收到报告后 40 分钟内下线模型，9 月 9 日恢复，并确认没有其他模型受影响。", "so_what": "这是推理基础设施层面的真实租户隔离事故，说明「上下文窗口」与「KV 缓存池容量」不匹配时，开源推理引擎可能以静默方式泄露跨请求数据。对自托管长上下文模型的团队，这是一条必须核对的配置红线。", "how_to_use": "检查你自托管推理服务的 max context 配置是否超过 KV 缓存池容量；对超长请求做显式拒绝而非依赖引擎报错；在网关层对超过池容量的 prompt 直接返回 4xx，并审计近期长上下文请求的响应是否混入他人数据。", "url": "https://blog.cloudflare.com/kv-cache-exposure-remediation/", "source": "Hacker News / Cloudflare Blog", "tags": ["安全", "推理基础设施"]}, {"title": "TraceTrial-Bench 论文：31.1% 的 agent 运行任务成功但至少一项 harness 标准失败", "summary": "论文提出 TraceTrial-Bench，用 95 个机制导向任务、覆盖上下文、执行、治理、生命周期、可观测性、工具和验证七个组件，分别评估 agent 任务表现与 harness 可靠性。在 4 个 harness、9 个模型、3,420 次运行中，31.1% 的运行虽然任务成功，但至少有一项 harness 标准失败。框架结合轨迹追踪、多源证据和两层评估，支持可审计的可靠性评估与失败归因。", "so_what": "任务成功率会掩盖 harness 层面的不可靠。近三分之一的成功运行其实在机制上已经出问题，这意味着只看端到端成功率的 agent 评测会系统性高估系统稳定性。", "how_to_use": "在内部 agent 评测中增加一层 harness 检查：记录每次运行的轨迹，按上下文、工具调用、验证等组件分别打标，把「任务成功但机制失败」的运行单独统计，作为可靠性债务清单。", "url": "https://huggingface.co/papers/2610.32285", "source": "HuggingFace Papers", "tags": ["论文", "Agent 评测"]}, {"title": "Hob：开源本地 AI 桌面应用，自动挑选适配本机的开放权重模型", "summary": "Frigade 发布 Hob，一个免费、开源的 Claude 和 ChatGPT 替代品，在 Mac、Windows 和 Linux 上本地运行 Gemma、gpt-oss 等开放权重模型，支持离线使用，采用 MIT 许可证。Hob 会自动挑选适合你电脑的最佳前沿开放权重模型并完成配置，可用于填写 PDF、处理文档等任务。仓库当前约 241 stars、12 forks。", "so_what": "本地 AI 的「安装与选型」摩擦正在被产品化解决。对隐私敏感或需要离线场景的团队，多了一个可审计的开源选项，而不必自己拼 llama.cpp 和模型选择逻辑。", "how_to_use": "在个人机器上下载对应平台版本，用它处理一份含敏感信息的 PDF 表单，验证离线可用性和输出质量；若团队有本地化需求，可基于 MIT 许可证审查其模型选择逻辑并集成。", "url": "https://github.com/FrigadeHQ/hob", "source": "Hacker News", "tags": ["开源工具", "本地模型"]}, {"title": "ECC：面向 Claude Code、Codex、Cursor 等 agent 的性能优化 harness 系统", "summary": "affaan-m/ECC 是一个 agent harness 性能优化系统，宣称提供 skills、instincts、memory、security 和 research-first development 能力，面向 Claude Code、Codex、Opencode、Cursor 等工具。仓库包含针对 .claude、.codex、.cursor、.gemini、.qwen、.zed 等多个 agent 环境的配置目录，以及 agents、commands、hooks、mcp-configs 等模块。", "so_what": "agent 工具生态正在从单一 IDE 插件走向跨 harness 的配置与优化层。这类项目反映了「同一套技能和记忆在多个 agent 间复用」的实际需求，但也意味着配置复杂度和安全面同步扩大。", "how_to_use": "浏览其 hooks 和 mcp-configs 目录，挑一个你正在用的 agent（如 Claude Code 或 Cursor），只移植其中 memory 或 skills 相关配置做小范围试验，不要一次性全量接入。", "url": "https://github.com/affaan-m/ECC", "source": "GitHub Trending", "tags": ["开源工具", "Agent 工程"]}], "action": "打开 Cloudflare 那篇事故报告，核对你自托管推理服务的 max context 与 KV 缓存池容量配置；若前者大于后者，在网关加一条超长 prompt 直接拒绝的规则。", "watch": "GPT-6.1 Terra 在低推理档位的实际性价比是否被独立评测复现，以及它是否会推动 Anthropic Sonnet 系列跟进降价。", "sources_note": "信息来自 Simon Willison、The Decoder、Hacker News、GitHub Trending、HuggingFace Papers 和 Cloudflare Blog 共 6 条原文。", "date": "2026-10-28", "grounded": true};
const STORE = 'aidaily-pos-' + DATA.date;
let i = 0;

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function slides(){
  const out = [];
  // 封面
  out.push(`<section class="slide hero" id="s0">
    <h2>今天的主线</h2>
    <p>${esc(DATA.intro)}</p>
    <h2>共 ${DATA.items.length} 条</h2>
    <ul class="toc">${DATA.items.map((it,n)=>
      `<li><b>${String(n+1).padStart(2,'0')}</b><span>${esc(it.title)}</span></li>`).join('')}</ul>
  </section>`);
  // 每一条
  DATA.items.forEach((it, n) => {
    out.push(`<section class="slide" id="s${n+1}">
      <div class="tags">${(it.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <h1>${esc(it.title)}</h1>
      <div class="block"><div class="label">讲了什么</div><div class="text">${esc(it.summary)}</div></div>
      ${it.so_what ? `<div class="block"><div class="label">为什么值得看</div><div class="text hl">${esc(it.so_what)}</div></div>` : ''}
      ${it.how_to_use ? `<div class="block"><div class="label">可以怎么用</div><div class="text">${esc(it.how_to_use)}</div></div>` : ''}
      <div class="block"><a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">读原文 →</a>
        <span class="srcname">${esc(it.source||'')}</span></div>
    </section>`);
  });
  // 收尾
  out.push(`<section class="slide hero" id="s${DATA.items.length+1}">
    <h2>今天花 10 分钟</h2>
    <div class="task"><div class="label">动手</div><div class="text">${esc(DATA.action||'')}</div></div>
    ${DATA.watch ? `<div class="task"><div class="label" style="color:#7aa9ff">值得盯的一条线</div><div class="text">${esc(DATA.watch)}</div></div>` : ''}
    <p style="font-size:14px;color:#8b94a7;margin-top:18px">${esc(DATA.sources_note||'')}</p>
  </section>`);
  return out;
}

const SLIDES = slides();
document.getElementById('main').innerHTML = SLIDES.join('');
document.getElementById('tot').textContent = SLIDES.length;

function render(){
  document.querySelectorAll('.slide').forEach((s,n)=>s.classList.toggle('on', n===i));
  document.getElementById('cur').textContent = i+1;
  document.getElementById('fill').style.width = ((i+1)/SLIDES.length*100) + '%';
  document.getElementById('prev').disabled = i===0;
  const nx = document.getElementById('next');
  nx.textContent = i === SLIDES.length-1 ? '✓ 今天学完了' : (i===0 ? '开始 →' : '下一条 →');
  nx.classList.toggle('done', i === SLIDES.length-1);
  window.scrollTo({top:0, behavior:'smooth'});
  try{localStorage.setItem(STORE, i)}catch(e){}
  try{history.replaceState(null,'','#s'+i)}catch(e){}
}

function go(n){
  if(n<0||n>=SLIDES.length) return;
  i=n; render();
}
document.getElementById('next').onclick = ()=> i===SLIDES.length-1 ? render() : go(i+1);
document.getElementById('prev').onclick = ()=> go(i-1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault(); go(i+1);}
  if(e.key==='ArrowLeft'){e.preventDefault(); go(i-1);}
});

let sx=0, sy=0;
document.addEventListener('touchstart', e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){ dx<0 ? go(i+1) : go(i-1); }
},{passive:true});

const m = location.hash.match(/^#s([0-9]+)$/);
if(m){ const h = +m[1]; if(h>=0 && h<SLIDES.length) i = h; }
else { try{ const saved = +localStorage.getItem(STORE); if(!isNaN(saved) && saved>0 && saved<SLIDES.length) i = saved; }catch(e0){} }
render();
</script>
</body>
</html>
